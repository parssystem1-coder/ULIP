openapi: 3.0.3
info:
  title: ULIP API
  version: 2.0.0
  description: |
    Universal Lead Intelligence Platform REST API — AUTHORITATIVE contract.

    This file is the single source of truth for the API surface (ADR-020).
    docs/api/API.md is a narrative companion and must not drift from this file;
    when they disagree, this file wins.

    Conventions:
      - All mutations that can be repeated accept an `Idempotency-Key` header
        (scoped per tenant + endpoint; replay returns the original response).
      - Tenant context is resolved from the authenticated token, never from
        client-supplied values.
      - Errors use the reusable ApiError schema (see components).
      - Job-initiating endpoints return 202 with a Job resource.
security:
  - bearerAuth: []
servers:
  - url: /api/v1
tags:
  - name: System
  - name: Sources
  - name: Discovery
  - name: Leads
  - name: Analysis
  - name: Evidence
  - name: Scores
  - name: Reviews
  - name: Taxonomy
  - name: Campaigns
  - name: Exports
  - name: Usage
  - name: AI Providers
  - name: Social Actions
  - name: Outreach

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /ready:
    get:
      tags: [System]
      summary: Readiness probe (dependencies checked)
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /sources:
    get:
      tags: [Sources]
      summary: List sources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceListResponse'
    post:
      tags: [Sources]
      summary: Create source
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '409':
          description: Duplicate source (Idempotency-Key replay conflict)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /discovery/search:
    post:
      tags: [Discovery]
      summary: Create discovery job
      description: Requires Idempotency-Key (repeat submissions return the original job).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveryRequest'
      responses:
        '202':
          description: Accepted (job persisted; transport.enqueued reports BullMQ state)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Validation error or missing Idempotency-Key (IDEMPOTENCY_KEY_REQUIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Source not found in tenant (tenant-scoped)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: |
            Conflict: SOURCE_NOT_ACTIVE (source paused/disabled) or
            IDEMPOTENCY_IN_FLIGHT (identical request still processing).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '402':
          description: Usage quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /discovery/jobs/{jobId}:
    get:
      tags: [Discovery]
      summary: Get job status
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
    delete:
      tags: [Discovery]
      summary: Request cooperative job cancellation
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202':
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '409':
          description: Job already terminal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStateError'

  /leads:
    get:
      tags: [Leads]
      summary: List leads (structured filters are authoritative)
      parameters:
        - in: query
          name: businessType
          schema: { type: string }
          description: Business Type taxonomy slug or id
        - in: query
          name: industry
          schema: { type: string }
        - in: query
          name: specialty
          schema: { type: string }
        - in: query
          name: brand
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: source
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/LeadStatus' }
        - in: query
          name: minRelevance
          schema: { type: number, minimum: 0, maximum: 100 }
        - in: query
          name: minAudienceQuality
          schema: { type: number, minimum: 0, maximum: 100 }
        - in: query
          name: minActivity
          schema: { type: number, minimum: 0, maximum: 100 }
        - in: query
          name: sort
          schema: { type: string, enum: [relevance, priority, activity, audienceQuality, createdAt] }
        - in: query
          name: order
          schema: { type: string, enum: [ASC, DESC], default: DESC }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadListResponse'
  /leads/{leadId}:
    get:
      tags: [Leads]
      summary: Get lead detail
      parameters:
        - $ref: '#/components/parameters/LeadId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /leads/search/natural-language:
    post:
      tags: [Leads]
      summary: Natural-language search (Persian first-class)
      description: |
        Parses user text (fa/en) into a typed StructuredSearchQuery and executes it.
        The LLM never emits SQL or raw filter expressions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, example: "عمده‌فروشان قطعات پرینتر HP در تهران" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadListResponse'
        '400':
          description: Ambiguous/unparseable query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /leads/{leadId}/reprocess:
    post:
      tags: [Analysis]
      summary: Queue reprocessing (new version; old versions stay auditable)
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { $ref: '#/components/schemas/AnalysisMode' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /leads/{leadId}/evidence:
    get:
      tags: [Evidence]
      summary: List lead evidence (provenance required per item)
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - in: query
          name: analysisId
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Evidence'
  /leads/{leadId}/scores:
    get:
      tags: [Scores]
      summary: Get current lead scores (policy-versioned)
      parameters:
        - $ref: '#/components/parameters/LeadId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadScore'
        '404':
          description: No current score yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /leads/{leadId}/audience-quality:
    get:
      tags: [Scores]
      summary: Get audience quality (risk-oriented, independent of relevance)
      parameters:
        - $ref: '#/components/parameters/LeadId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudienceQuality'
  /leads/{leadId}/reviews:
    post:
      tags: [Reviews]
      summary: Submit human review
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          description: Reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
  /reviews/queue:
    get:
      tags: [Reviews]
      summary: Review queue
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadListResponse'

  /taxonomy:
    get:
      tags: [Taxonomy]
      summary: Get taxonomy tree
      parameters:
        - in: query
          name: locale
          schema: { type: string, default: fa }
        - in: query
          name: nodeKind
          schema: { $ref: '#/components/schemas/TaxonomyNodeKind' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyNodeListResponse'
    post:
      tags: [Taxonomy]
      summary: Create taxonomy node
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaxonomyNodeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyNode'
        '409':
          description: Duplicate slug in scope (root or sibling)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
  /taxonomy/{nodeId}:
    patch:
      tags: [Taxonomy]
      summary: Update/move/deactivate node
      parameters:
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaxonomyNodeRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyNode'
        '409':
          description: Invalid hierarchy edge (parent kind mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
  /taxonomy/{nodeId}/translations:
    put:
      tags: [Taxonomy]
      summary: Upsert node translation
      parameters:
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale, name]
              properties:
                locale: { type: string, example: fa }
                name: { type: string, example: "رنگ و لایت" }
                description: { type: string }
      responses:
        '200':
          description: Upserted
  /taxonomy/{nodeId}/aliases:
    put:
      tags: [Taxonomy]
      summary: Upsert node alias (normalized automatically; Persian first-class)
      parameters:
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alias]
              properties:
                alias: { type: string, example: "آرایشگاه زنانه" }
                locale: { type: string, default: fa }
      responses:
        '200':
          description: Upserted

  /campaigns:
    get:
      tags: [Campaigns]
      summary: List campaigns
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignListResponse'
    post:
      tags: [Campaigns]
      summary: Create campaign
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
  /campaigns/{campaignId}/leads:
    post:
      tags: [Campaigns]
      summary: Add leads to campaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkLeadRequest'
      responses:
        '200':
          description: Added
    delete:
      tags: [Campaigns]
      summary: Remove leads from campaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkLeadRequest'
      responses:
        '200':
          description: Removed

  /exports:
    post:
      tags: [Exports]
      summary: Queue export job (async; never synchronous)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExportRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
  /exports/{exportId}:
    get:
      tags: [Exports]
      summary: Get export status/result
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'

  /usage:
    get:
      tags: [Usage]
      summary: Usage counters for current period
      parameters:
        - in: query
          name: period
          schema: { type: string, example: '2026-10' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'

  # ----------------- Outreach (ADR-026) -----------------
  /outreach/templates:
    get:
      tags: [Outreach]
      summary: List message templates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageTemplate'
    post:
      tags: [Outreach]
      summary: Create a message template ({{placeholders}} are validated)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplate'
        '409':
          description: Duplicate template name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
  /outreach/templates/{templateId}/preview:
    post:
      tags: [Outreach]
      summary: Render a template preview (no state change)
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variables]
              properties:
                variables:
                  type: object
                  additionalProperties: { type: string }
                  example: { business_name: "چاپخانه تهران", city: "تهران" }
      responses:
        '200':
          description: Rendered preview
          content:
            application/json:
              schema:
                type: object
                required: [rendered]
                properties:
                  rendered: { type: string }
        '400':
          description: Missing variables for placeholders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /outreach/campaigns:
    get:
      tags: [Outreach]
      summary: List outreach campaigns
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OutreachCampaign'
    post:
      tags: [Outreach]
      summary: Create an outreach campaign (DRAFT)
      description: |
        Filters preserve the universal business model: Business Type → Industry
        → Specialty → Sub-specialty + Location (e.g. Wholesaler → Printing →
        Printer Parts → Tehran).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOutreachCampaignRequest'
      responses:
        '201':
          description: Created as DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachCampaign'
  /outreach/campaigns/{campaignId}:
    get:
      tags: [Outreach]
      summary: Get outreach campaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachCampaign'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /outreach/campaigns/{campaignId}/recipients:
    put:
      tags: [Outreach]
      summary: Select recipients + eligibility check + per-lead previews
      description: |
        Bulk messaging is ONE separate message per selected lead (never a group
        chat). Every recipient gets its own rendered message. Retry-safe:
        already SENT recipients are left untouched.
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leads]
              properties:
                leads:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [leadId]
                    properties:
                      leadId: { type: string, format: uuid }
                      variables:
                        type: object
                        additionalProperties: { type: string }
      responses:
        '200':
          description: Selection summary with previews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectionSummary'
  /outreach/campaigns/{campaignId}/submit:
    post:
      tags: [Outreach]
      summary: Submit campaign for approval (DRAFT → PENDING_APPROVAL)
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachCampaign'
        '409':
          description: No eligible recipients or invalid state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStateError'
  /outreach/campaigns/{campaignId}/confirm:
    post:
      tags: [Outreach]
      summary: Explicit human confirmation of the previewed plan (PENDING_APPROVAL → APPROVED)
      description: |
        Default bulk execution REQUIRES this explicit confirmation. Numbers the
        operator confirms must match the stored plan exactly, otherwise 409.
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected]
              properties:
                expected:
                  type: object
                  required: [recipients, eligible]
                  properties:
                    recipients: { type: integer, minimum: 1 }
                    eligible: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachCampaign'
        '409':
          description: Confirmation mismatch with the stored plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStateError'
  /outreach/campaigns/{campaignId}/execute:
    post:
      tags: [Outreach]
      summary: Execute the confirmed campaign (bulk = one separate message per lead)
      description: |
        Runs as a persistent OUTREACH job. Idempotent: re-running never re-sends
        to SENT recipients. Cooperatively cancellable. Pause/resume supported.
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '202':
          description: Execution accepted (job-based)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '409':
          description: Campaign not APPROVED (or confirmation drift)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStateError'
  /outreach/campaigns/{campaignId}/pause:
    post:
      tags: [Outreach]
      summary: Pause a running campaign (EXECUTING → PAUSED)
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachCampaign'
        '409':
          description: Not EXECUTING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStateError'
  /outreach/campaigns/{campaignId}/cancel:
    post:
      tags: [Outreach]
      summary: Cancel the campaign and pending recipients
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachCampaign'
        '409':
          description: Terminal state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStateError'
  /outreach/campaigns/{campaignId}/report:
    get:
      tags: [Outreach]
      summary: Campaign progress + delivery report
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignReport'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /outreach/history:
    get:
      tags: [Outreach]
      summary: Outreach/action history (lead contact history, tenant-scoped)
      parameters:
        - in: query
          name: leadId
          schema: { type: string, format: uuid }
        - in: query
          name: campaignId
          schema: { type: string, format: uuid }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContactHistoryEntry'
  /outreach/suppression:
    get:
      tags: [Outreach]
      summary: List suppression entries
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SuppressionEntry'
    post:
      tags: [Outreach]
      summary: Add a suppression entry (suppression always wins)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSuppressionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuppressionEntry'
        '409':
          description: Duplicate suppression entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'

  /ai/providers:
    get:
      tags: [AI Providers]
      summary: List configured AI providers (incl. optional DecisionProvider)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiProvider'

  # ----------------- Social Actions (ADR-026) -----------------
  /social/capabilities/{sourceType}:
    get:
      tags: [Social Actions]
      summary: Honest per-source action capability report
      description: |
        Only `SUPPORTED` actions may be rendered as executable in the UI.
        Support is discovered from the authorized provider integration, never
        assumed (ADR-026). Unsupported actions use the manual fallback flow.
      parameters:
        - $ref: '#/components/parameters/SourceTypeId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionCapabilityReport'
        '404':
          description: Unknown source type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /social/actions:
    post:
      tags: [Social Actions]
      summary: Execute or enqueue a single social action
      description: |
        Idempotent per (tenant, Idempotency-Key). Unsupported capabilities are
        refused honestly with status NOT_SUPPORTED plus a manual fallback plan;
        no provider call is made and success is never faked.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteActionRequest'
      responses:
        '201':
          description: Executed / refused / blocked (see result.kind)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteActionResult'
        '409':
          description: Idempotency-Key replay conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
    get:
      tags: [Social Actions]
      summary: List social actions (tenant-scoped history)
      parameters:
        - in: query
          name: leadId
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/SocialActionStatus' }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialActionListResponse'
  /social/actions/{actionId}:
    get:
      tags: [Social Actions]
      summary: Get a social action
      parameters:
        - $ref: '#/components/parameters/ActionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAction'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
    delete:
      tags: [Social Actions]
      summary: Cancel a PENDING/AWAITING_APPROVAL/APPROVED action
      parameters:
        - $ref: '#/components/parameters/ActionId'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAction'
        '409':
          description: Action state does not allow cancellation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStateError'
  /social/actions/{actionId}/approve:
    post:
      tags: [Social Actions]
      summary: Approve an action awaiting approval
      parameters:
        - $ref: '#/components/parameters/ActionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAction'
        '409':
          description: Action not in AWAITING_APPROVAL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStateError'
  /social/actions/{actionId}/retry:
    post:
      tags: [Social Actions]
      summary: Retry a FAILED action (respects provider retry-after)
      parameters:
        - $ref: '#/components/parameters/ActionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Retry outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteActionResult'
        '409':
          description: Action not in FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStateError'
  /social/actions/{actionId}/attempts:
    get:
      tags: [Social Actions]
      summary: Action audit trail (attempts incl. provider retry-after)
      parameters:
        - $ref: '#/components/parameters/ActionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SocialActionAttempt'
  /social/actions/{actionId}/fallback:
    post:
      tags: [Social Actions]
      summary: Enter the manual fallback flow (Open Profile → Copy Prepared Message → perform manually)
      parameters:
        - $ref: '#/components/parameters/ActionId'
      responses:
        '200':
          description: Manual fallback plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualFallbackPlan'
        '409':
          description: Only NOT_SUPPORTED actions enter fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStateError'
  /social/actions/{actionId}/complete-manual:
    post:
      tags: [Social Actions]
      summary: Mark a manual fallback action as completed by the user
      parameters:
        - $ref: '#/components/parameters/ActionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Completed manually
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAction'
        '409':
          description: Action not in MANUAL_FALLBACK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStateError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    LeadId:
      name: leadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ActionId:
      name: actionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SourceTypeId:
      name: sourceType
      in: path
      required: true
      schema: { type: string, example: instagram }
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NodeId:
      name: nodeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
      description: |
        Scope: tenant + endpoint + key. Same key + same request body → replay the
        original response. Same key + different body → 409 CONFLICT. Records
        expire after 24h; IN_FLIGHT replays return 409 with Retry-After.
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string }
  schemas:
    # ---------------- system ----------------
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [UP, DOWN] }
        checks:
          type: object
          additionalProperties: { type: boolean }
    # ---------------- sources ----------------
    CreateSourceRequest:
      type: object
      required: [type, name]
      properties:
        type: { type: string, example: INSTAGRAM }
        name: { type: string }
        config: { type: object, additionalProperties: true }
    Source:
      type: object
      required: [id, type, name, status]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, PAUSED, DISABLED] }
        capabilities:
          type: array
          items: { type: string, enum: [profile_search, profile_fetch, content_fetch, image_fetch, location, engagement_metrics] }
        createdAt: { type: string, format: date-time }
    SourceListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Source'
    # ---------------- discovery ----------------
    DiscoveryRequest:
      type: object
      required: [sourceId]
      properties:
        sourceId: { type: string, format: uuid }
        query: { type: string, example: "آرایشگران شیراز" }
        filters:
          type: object
          description: >-
            Universal business model as string filters: businessType, industry,
            specialty, subSpecialty, brand, location. Example: "HP printer parts
            wholesalers in Tehran" maps to businessType=Wholesaler,
            industry=Printing, specialty=Printer Parts, brand=HP, location=Tehran.
          additionalProperties: { type: string }
          example:
            businessType: Wholesaler
            industry: Printing
            specialty: Printer Parts
            brand: HP
            location: Tehran
        analysisMode: { $ref: '#/components/schemas/AnalysisMode' }
        maxCandidates: { type: integer, minimum: 1, maximum: 10000 }
        cursor: { type: string, description: opaque pagination cursor from a previous page }
        allowFake:
          type: boolean
          default: false
          description: >-
            Local E2E ONLY: explicitly opts into the deterministic fake provider
            registered for source type FAKE. Production source types are never
            affected.
    JobStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED, SKIPPED]
    Job:
      type: object
      required: [id, type, status, progress]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [DISCOVERY, NORMALIZATION, DEDUP, ANALYSIS, SCORING, EXPORT, REPROCESS, OUTREACH] }
        status: { $ref: '#/components/schemas/JobStatus' }
        currentStep:
          type: string
          enum: [DISCOVERY, FETCH, NORMALIZATION, DEDUP, ANALYSIS, VISION, DECISION, EVIDENCE_VALIDATION, SCORING]
        progress: { type: integer, minimum: 0, maximum: 100 }
        attemptCount: { type: integer }
        maxAttempts: { type: integer }
        errorCode: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        correlationId: { type: string, format: uuid, nullable: true }
        runAfter: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    # ---------------- taxonomy ----------------
    TaxonomyNodeKind:
      type: string
      enum: [BUSINESS_TYPE, INDUSTRY, SPECIALTY, SUB_SPECIALTY]
    TaxonomyNode:
      type: object
      required: [id, nodeKind, slug, name]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: string, format: uuid, nullable: true }
        nodeKind: { $ref: '#/components/schemas/TaxonomyNodeKind' }
        slug: { type: string }
        name: { type: string, description: "Name in requested locale" }
        description: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        translations:
          type: array
          items:
            type: object
            properties:
              locale: { type: string }
              name: { type: string }
        aliases:
          type: array
          items: { type: string }
    CreateTaxonomyNodeRequest:
      type: object
      required: [nodeKind, name, slug]
      properties:
        parentId: { type: string, format: uuid, nullable: true }
        nodeKind: { $ref: '#/components/schemas/TaxonomyNodeKind' }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
    UpdateTaxonomyNodeRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        parentId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    TaxonomyNodeListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyNode'
    # ---------------- leads ----------------
    LeadStatus:
      type: string
      enum: [DISCOVERED, RAW_STORED, NORMALIZED, DEDUP_CHECKED, ANALYSIS_PENDING, ANALYZING, SCORED, REVIEW_REQUIRED, QUALIFIED, REJECTED, FAILED, ARCHIVED]
    AnalysisMode:
      type: string
      enum: [BASIC, STANDARD, DEEP]
    Availability:
      type: string
      enum: [AVAILABLE, PARTIAL, INFERRED, UNAVAILABLE]
    LocationValue:
      type: object
      required: [rawValue, availability]
      properties:
        country: { type: string, nullable: true }
        province: { type: string, nullable: true }
        city: { type: string, nullable: true }
        district: { type: string, nullable: true }
        rawValue: { type: string }
        availability: { $ref: '#/components/schemas/Availability' }
        confidence: { type: number, nullable: true }
    ContactValue:
      type: object
      required: [kind, value, availability]
      properties:
        kind: { type: string, enum: [PHONE, MOBILE, WHATSAPP, EMAIL, WEBSITE, SOCIAL] }
        value: { type: string }
        availability: { $ref: '#/components/schemas/Availability' }
        isSensitive: { type: boolean, default: false }
    Business:
      type: object
      required: [id, canonicalName]
      properties:
        id: { type: string, format: uuid }
        canonicalName: { type: string }
        businessTypes:
          type: array
          items: { type: string, description: "Business Type node refs (first-class)" }
        industries:
          type: array
          items: { type: string }
        website: { type: string, nullable: true }
        locations:
          type: array
          items:
            $ref: '#/components/schemas/LocationValue'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactValue'
    LeadIdentity:
      type: object
      required: [sourceType, externalId]
      properties:
        sourceType: { type: string }
        externalId: { type: string }
        username: { type: string, nullable: true }
        profileUrl: { type: string, nullable: true }
        displayName: { type: string, nullable: true }
    LeadClassification:
      type: object
      required: [classificationType, source]
      properties:
        classificationType: { type: string, enum: [BUSINESS_TYPE, INDUSTRY, SPECIALTY, SUB_SPECIALTY, BRAND, OTHER] }
        taxonomyNodeId: { type: string, format: uuid, nullable: true }
        valueText: { type: string, nullable: true }
        confidence: { type: number, nullable: true }
        source: { type: string, enum: [AI, RULE, HUMAN] }
        modelVersion: { type: string, nullable: true }
    LeadAnalysis:
      type: object
      required: [id, analysisVersion, isCurrent]
      properties:
        id: { type: string, format: uuid }
        analysisVersion: { type: string }
        modelVersion: { type: string, nullable: true }
        promptVersion: { type: string, nullable: true }
        schemaVersion: { type: string, nullable: true }
        taxonomyVersion: { type: integer }
        analysisMode: { type: string, enum: [BASIC, STANDARD, DEEP, BE_REUSE] }
        summary: { type: string, nullable: true }
        confidence: { type: number, nullable: true }
        isCurrent: { type: boolean }
        supersededAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    Evidence:
      type: object
      required: [id, evidenceType, sourceType, sourceReference, contentHash, retrievedAt]
      properties:
        id: { type: string, format: uuid }
        analysisId: { type: string, format: uuid, nullable: true }
        evidenceType:
          type: string
          enum: [BIO_TEXT, CAPTION_TEXT, IMAGE_OBSERVATION, CONTENT_METADATA, LOCATION_SIGNAL, PROFILE_METADATA, ENGAGEMENT_SIGNAL, MODEL_INFERENCE, HUMAN_CORRECTION]
        sourceType: { type: string }
        sourceReference: { type: string }
        content: { type: string, nullable: true }
        contentHash: { type: string }
        retrievedAt: { type: string, format: date-time }
        confidence: { type: number, nullable: true }
    LeadScore:
      type: object
      required: [relevance, audienceQuality, activity, confidence, priority, scoringPolicyVersion]
      properties:
        relevance: { type: number, minimum: 0, maximum: 100 }
        audienceQuality: { type: number, minimum: 0, maximum: 100, description: "Independent of relevance" }
        activity: { type: number, minimum: 0, maximum: 100 }
        confidence: { type: number, minimum: 0, maximum: 100 }
        priority: { type: number, minimum: 0, maximum: 100 }
        scoringPolicyVersion: { type: string }
        reviewOutcome: { type: string, enum: [QUALIFIED, REVIEW_REQUIRED, REJECTED] }
    AudienceQuality:
      type: object
      required: [riskLevel]
      properties:
        qualityScore: { type: number, minimum: 0, maximum: 100, nullable: true }
        riskLevel: { type: string, enum: [LOW, MEDIUM, HIGH, UNKNOWN] }
        signals: { type: array, items: { type: object, additionalProperties: true } }
        confidence: { type: number, nullable: true }
        modelVersion: { type: string, nullable: true }
    Decision:
      type: object
      required: [status, provider]
      properties:
        id: { type: string, format: uuid }
        decisionType: { type: string }
        options:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
        probabilities:
          type: array
          items:
            type: object
            required: [optionId, probability]
            properties:
              optionId: { type: string }
              probability: { type: number, minimum: 0, maximum: 1 }
        selectedOptionId: { type: string, nullable: true }
        appliedThreshold: { type: number, nullable: true }
        status: { type: string, enum: [ACCEPTED, REVIEW_REQUIRED, REJECTED, ABSTAINED] }
        provider: { type: string, description: "Provider name or RULES" }
        modelVersion: { type: string, nullable: true }
    Lead:
      type: object
      required: [id, status, business]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/LeadStatus' }
        business: { $ref: '#/components/schemas/Business' }
        identities:
          type: array
          items:
            $ref: '#/components/schemas/LeadIdentity'
        classifications:
          type: array
          items:
            $ref: '#/components/schemas/LeadClassification'
        currentAnalysis:
          allOf:
            - $ref: '#/components/schemas/LeadAnalysis'
          nullable: true
        currentScore:
          allOf:
            - $ref: '#/components/schemas/LeadScore'
          nullable: true
        audienceQuality:
          allOf:
            - $ref: '#/components/schemas/AudienceQuality'
          nullable: true
        decision:
          allOf:
            - $ref: '#/components/schemas/Decision'
          nullable: true
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    LeadListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Lead'
        pagination: { $ref: '#/components/schemas/Pagination' }
    # ---------------- reviews / campaigns / exports / usage / ai ----------------
    ReviewRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [ACCEPT, REJECT, CORRECT, MARK_UNCERTAIN] }
        correctedValue: { type: object, additionalProperties: true }
        reason: { type: string }
    Review:
      type: object
      required: [id, leadId, decision]
      properties:
        id: { type: string, format: uuid }
        leadId: { type: string, format: uuid }
        decision: { type: string, enum: [ACCEPT, REJECT, CORRECT, MARK_UNCERTAIN] }
        originalValue: { type: object, additionalProperties: true, nullable: true }
        correctedValue: { type: object, additionalProperties: true, nullable: true }
        reason: { type: string, nullable: true }
        modelVersion: { type: string, nullable: true }
        taxonomyVersion: { type: integer, nullable: true }
        scoringPolicyVersion: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Campaign:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, ACTIVE, COMPLETED, ARCHIVED] }
        filters: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    CreateCampaignRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        filters: { type: object, additionalProperties: true }
    CampaignListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'
    BulkLeadRequest:
      type: object
      required: [leadIds]
      properties:
        leadIds:
          type: array
          items: { type: string, format: uuid }
          maxItems: 1000
    CreateExportRequest:
      type: object
      required: [exportType]
      properties:
        exportType: { type: string, enum: [CSV, JSON, XLSX] }
        campaignId: { type: string, format: uuid, nullable: true }
        filters: { type: object, additionalProperties: true }
    Export:
      type: object
      required: [id, exportType, status]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid, nullable: true }
        exportType: { type: string, enum: [CSV, JSON, XLSX] }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED] }
        fileUrl: { type: string, nullable: true, description: "Signed URL when COMPLETED; expires" }
        createdAt: { type: string, format: date-time }
    UsageResponse:
      type: object
      required: [period, counters]
      properties:
        period: { type: string, example: '2026-10' }
        counters:
          type: object
          additionalProperties: { type: number }
    AiProvider:
      type: object
      required: [id, name, type, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [LLM, VISION, DECISION, EMBEDDING, OTHER] }
        status: { type: string, enum: [ACTIVE, DISABLED] }
    # ---------------- social actions (ADR-026) ----------------
    ActionCapability:
      type: string
      enum: [OPEN_PROFILE, FOLLOW_PROFILE, UNFOLLOW_PROFILE, SEND_MESSAGE, BULK_SEND_MESSAGE]
    SocialActionType:
      type: string
      enum: [OPEN_PROFILE, FOLLOW_PROFILE, UNFOLLOW_PROFILE, SEND_MESSAGE]
    SocialActionStatus:
      type: string
      enum: [PENDING, AWAITING_APPROVAL, APPROVED, EXECUTING, SUCCEEDED, FAILED, CANCELLED, NOT_SUPPORTED, MANUAL_FALLBACK]
    ActionCapabilityReport:
      type: object
      required: [sourceType, capabilities]
      properties:
        sourceType: { type: string, example: instagram }
        capabilities:
          type: object
          description: "Only SUPPORTED actions may render as executable in the UI"
          additionalProperties:
            type: string
            enum: [SUPPORTED, NOT_SUPPORTED]
    ExecuteActionRequest:
      type: object
      required: [leadId, sourceType, type]
      properties:
        leadId: { type: string, format: uuid }
        sourceType: { type: string, example: instagram }
        type: { $ref: '#/components/schemas/SocialActionType' }
        message:
          type: string
          description: "Required for SEND_MESSAGE; rendered from a template"
        templateId: { type: string, format: uuid }
        requireApproval: { type: boolean, default: false }
    SocialAction:
      type: object
      required: [id, leadId, sourceType, type, status, idempotencyKey]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        leadId: { type: string, format: uuid }
        sourceType: { type: string }
        type: { $ref: '#/components/schemas/SocialActionType' }
        status: { $ref: '#/components/schemas/SocialActionStatus' }
        idempotencyKey: { type: string }
        profileUrl: { type: string, nullable: true }
        renderedMessage:
          type: string
          nullable: true
          description: "Sensitive; exposure follows the retention policy"
        campaignId: { type: string, format: uuid, nullable: true }
        templateId: { type: string, format: uuid, nullable: true }
        errorCode: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        executedAt: { type: string, format: date-time, nullable: true }
        manualCompletedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SocialActionListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SocialAction'
        pagination: { $ref: '#/components/schemas/Pagination' }
    SocialActionAttempt:
      type: object
      required: [id, actionId, attemptNo, outcome, startedAt]
      properties:
        id: { type: string, format: uuid }
        actionId: { type: string, format: uuid }
        attemptNo: { type: integer, minimum: 1 }
        outcome: { type: string, enum: [SUCCESS, RETRYABLE_FAILURE, FATAL_FAILURE, NOT_SUPPORTED] }
        errorCode: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        retryAfterAt:
          type: string
          format: date-time
          nullable: true
          description: "Provider retry-after hint; respected, never evaded"
        providerRef: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
    ManualFallbackPlan:
      type: object
      required: [actionType, sourceType, instructions, reason]
      properties:
        actionType: { $ref: '#/components/schemas/SocialActionType' }
        sourceType: { type: string }
        targetProfileUrl: { type: string, nullable: true }
        preparedMessage:
          type: string
          nullable: true
          description: "Copy-ready message for manual sending"
        instructions:
          type: array
          items: { type: string }
        reason:
          type: string
          enum: [ACTION_CAPABILITY_NOT_SUPPORTED]
    ExecuteActionResult:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [EXECUTED, NOT_SUPPORTED, IDEMPOTENT_REPLAY, BLOCKED_SUPPRESSED, BLOCKED_RECENT_CONTACT, AWAITING_APPROVAL, COMPLETED_MANUALLY]
        action: { $ref: '#/components/schemas/SocialAction' }
        fallback: { $ref: '#/components/schemas/ManualFallbackPlan' }
        reason: { type: string, nullable: true }
        lastContactAt: { type: string, format: date-time, nullable: true }
    # ---------------- outreach (ADR-026) ----------------
    MessageTemplate:
      type: object
      required: [id, name, body, variables, status]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        body:
          type: string
          description: "Supports {{variable}} placeholders"
        variables:
          type: array
          items: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    CreateTemplateRequest:
      type: object
      required: [name, body]
      properties:
        name: { type: string }
        body:
          type: string
          example: "سلام {{business_name}}، محصولات شما در {{city}} عالی است."
    OutreachCampaign:
      type: object
      required: [id, name, templateId, status]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        templateId: { type: string, format: uuid }
        filters: { $ref: '#/components/schemas/OutreachFilters' }
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, APPROVED, EXECUTING, PAUSED, COMPLETED, CANCELLED]
        jobId: { type: string, format: uuid, nullable: true }
        approvedBy: { type: string, format: uuid, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancelReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    OutreachFilters:
      type: object
      description: "Universal business model filters (ADR-018)"
      properties:
        businessTypes:
          type: array
          items: { type: string }
          example: [wholesaler]
        industries:
          type: array
          items: { type: string }
          example: [printing]
        specialties:
          type: array
          items: { type: string }
          example: [printer-parts]
        subSpecialties:
          type: array
          items: { type: string }
        city: { type: string, example: "تهران" }
        country: { type: string }
        sourceType: { type: string }
    CreateOutreachCampaignRequest:
      type: object
      required: [name, templateId, filters]
      properties:
        name: { type: string }
        description: { type: string }
        templateId: { type: string, format: uuid }
        filters: { $ref: '#/components/schemas/OutreachFilters' }
    SelectionSummary:
      type: object
      required: [total, eligible, ineligible, previews]
      properties:
        total: { type: integer, minimum: 0 }
        eligible: { type: integer, minimum: 0 }
        ineligible: { type: integer, minimum: 0 }
        byReason:
          type: object
          additionalProperties: { type: integer }
        previews:
          type: array
          items:
            type: object
            required: [leadId, eligible]
            properties:
              leadId: { type: string, format: uuid }
              eligible: { type: boolean }
              reason: { type: string, nullable: true }
              message:
                type: string
                nullable: true
                description: "This lead's own rendered message (never shared)"
    CampaignReport:
      type: object
      required: [campaignId, status, totals, progress]
      properties:
        campaignId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, PENDING_APPROVAL, APPROVED, EXECUTING, PAUSED, COMPLETED, CANCELLED] }
        totals:
          type: object
          required: [recipients, eligible, sent, failed, skipped, cancelled, pending]
          properties:
            recipients: { type: integer, minimum: 0 }
            eligible: { type: integer, minimum: 0 }
            sent: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
            skipped: { type: integer, minimum: 0 }
            cancelled: { type: integer, minimum: 0 }
            pending: { type: integer, minimum: 0 }
        skipReasons:
          type: object
          additionalProperties: { type: integer }
        progress: { type: integer, minimum: 0, maximum: 100 }
    ContactHistoryEntry:
      type: object
      required: [id, leadId, channel, direction, occurredAt]
      properties:
        id: { type: string, format: uuid }
        leadId: { type: string, format: uuid }
        campaignId: { type: string, format: uuid, nullable: true }
        socialActionId: { type: string, format: uuid, nullable: true }
        channel: { type: string, enum: [DIRECT_MESSAGE, PROFILE_VISIT, FOLLOW, UNFOLLOW, OTHER] }
        direction: { type: string, enum: [OUTBOUND, MANUAL] }
        occurredAt: { type: string, format: date-time }
        summary: { type: string }
    SuppressionEntry:
      type: object
      required: [id, scope, reason]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [LEAD, BUSINESS, EMAIL, PHONE, DOMAIN] }
        leadId: { type: string, format: uuid, nullable: true }
        businessId: { type: string, format: uuid, nullable: true }
        valueText: { type: string, nullable: true }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    CreateSuppressionRequest:
      type: object
      required: [scope, reason]
      properties:
        scope: { type: string, enum: [LEAD, BUSINESS, EMAIL, PHONE, DOMAIN] }
        leadId: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        valueText: { type: string }
        reason: { type: string }
        notes: { type: string }
    # ---------------- errors ----------------
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, VALIDATION_FAILED, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, PROVIDER_ERROR, JOB_STATE_INVALID, QUOTA_EXCEEDED, INTERNAL]
            message: { type: string }
            details: { type: object, additionalProperties: true }
        requestId: { type: string, description: "Echo of X-Request-Id or generated" }
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [VALIDATION_FAILED] }
                details:
                  type: object
                  properties:
                    fields:
                      type: array
                      items:
                        type: object
                        properties:
                          field: { type: string }
                          issue: { type: string }
    AuthorizationError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [UNAUTHORIZED, FORBIDDEN] }
    NotFoundError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [NOT_FOUND] }
    ConflictError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [CONFLICT] }
    RateLimitError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [RATE_LIMITED] }
    ProviderError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [PROVIDER_ERROR] }
    JobStateError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [JOB_STATE_INVALID] }
